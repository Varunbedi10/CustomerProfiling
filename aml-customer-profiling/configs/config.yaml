# Configuration parameters for AML Customer Profiling

data:
  raw_path: "data/raw/PS_20174392719_1491204439457_log.csv"
  processed_path: "data/processed/"
  
preprocessing:
  handle_missing: "drop"
  remove_duplicates: true
  normalize: true
  
modeling:
  n_clusters: 3
  random_state: 42
  algorithm: "kmeans"
  
evaluation:
  silhouette_score_threshold: 0.5
  davies_bouldin_score_threshold: 1.5
